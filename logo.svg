<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Leonida VI — מדריך מעריצים</title>
  <desc id="logo-desc">לוגו מקורי לאתר מעריצים, עם שמש טרופית, דקל, גלים והכיתוב Leonida VI Fan Guide.</desc>
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe27a"/><stop offset="1" stop-color="#ff4e9b"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9fffb"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65f2ee"/><stop offset="1" stop-color="#ff4e9b"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(18 7)">
    <circle cx="100" cy="96" r="77" fill="url(#sun)" opacity=".96" filter="url(#glow)"/>
    <path d="M25 111h150M35 130h130M49 148h111" stroke="#24172f" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    <path d="M101 163c9-41 12-77 5-121" fill="none" stroke="#14242d" stroke-width="12" stroke-linecap="round"/>
    <path d="M106 54C73 27 47 28 29 40c28 2 50 11 75 28M107 53c19-33 44-44 68-43-23 13-41 30-58 52M107 53c-5-26 4-48 18-62 0 21-2 42-9 64M104 58C76 51 57 59 43 73c24-7 44-8 64-4M108 58c25-12 49-7 66 5-25-3-45-2-65 4" fill="#14242d"/>
    <path d="M28 178h146" stroke="url(#wave)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="900">
    <text x="220" y="105" fill="url(#word)" font-size="67" letter-spacing="3">LEONIDA</text>
    <text x="226" y="157" fill="#ff4e9b" font-size="26" letter-spacing="9">FAN GUIDE</text>
    <text x="579" y="158" fill="#ffe27a" font-size="78" font-style="italic" filter="url(#glow)">VI</text>
  </g>
</svg>
